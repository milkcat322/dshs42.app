<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>dshsplus</title>
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
// dshsplus.app 첫 화면 — 42기 앱(42/)과 43기 앱(43/) 중 내 기수로 바로 보냅니다 (scripts/build-plus.mjs 가 묶음).
// 기수는 계정에 저장합니다: 설정에서 고른 값(로그인 계정의 user_metadata.plus_cohort) → 앱이 마지막으로 맞춘 값(dshsplus-cohort)
// → 지난 화면(dshs-snap)의 학번. 아무것도 없으면(로그인 전) 42기 앱의 로그인 화면으로 가고, 로그인하면 plus.js 가 학번으로 맞춥니다.
// 알림을 누르면 이 주소(/?view=…)로 오므로, 주소 뒤 ?… · #… 는 그대로 넘깁니다.
(function () {
  const ok = (c) => (c === 42 || c === 43 ? c : null);
  const read = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
  const sid = read("dshs-snap")?.me?.student_id;
  const c = ok(+read("dshs-study-auth")?.user?.user_metadata?.plus_cohort)
    || ok(+read("dshsplus-cohort"))
    || (sid ? (sid >= 1000 && sid <= 1999 ? 43 : 42) : null)
    || 42;
  location.replace(`${c}/${location.search}${location.hash}`);
})();
</script>
<style>body { margin: 0; background: #0a0a0f; }</style>
</head>
<body></body>
</html>
