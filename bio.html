window.BIO_EMBED = new URLSearchParams(location.search).has('embed') && window.parent !== window;
window.vocabTheme = function () {
  if (!window.BIO_EMBED) return;
  try {
    const p = window.parent.document.documentElement, r = document.documentElement;
    const tone = p.dataset.tone === 'light' ? 'light' : 'dark';
    r.dataset.theme = tone; r.style.colorScheme = tone;

    if (window.frameElement) window.frameElement.style.colorScheme = tone;
  } catch (e) {}

{

function polSvg(lab,o){let s=`<ellipse rx="64" ry="38" fill="${gid(C.pol)}" stroke="${C.polS}" stroke-width="1.2" opacity=".94"/>`+bumps(64,38,C.pol,9);

/* --- RNA transcript geometry (3′ end inside polymerase, s = distance from exit toward 5′) --- */
const E0=[-28,-30],DV=[-.995,-.1],LP=Math.PI*9,STEM=30;
function rpt(s,p){const a=p.a??8,f=p.fold||0;const st=[E0[0]+DV[0]*s,E0[1]+DV[1]*s];if(!f||s<a)return st;
 const R=[E0[0]+DV[0]*a,E0[1]+DV[1]*a];let q;
 if(s<a+STEM)q=[R[0],R[1]-(s-a)];
 else if(s<a+STEM+LP){const th=(s-a-STEM)/9;q=[R[0]-9+9*Math.cos(th),R[1]-STEM-9*Math.sin(th)];}

const TREE=[{t:'전사',e:'transcription',c:'#1f4e8c',k:[
  {t:'개시',e:'initiation',k:[{t:'원핵',tag:'σ factor + core',m:'prokInit'},{t:'진핵',tag:'TATA box',m:'eukInit'}]},

function node(n,lv){if(n.m)return `<details class="leaf" data-m="${n.m}"><summary>${n.t}${n.e?` <span class="en">${n.e}</span>`:''}${n.tag?` <span class="tag">${n.tag}</span>`:''}</summary><div class="vh"></div></details>`;
 return `<details class="${lv===1?'lv1':''}" ${lv===1?`style="--c:${n.c}"`:''} open><summary>${n.t} <span class="en">${n.e||''}</span></summary>${n.k.map(c=>node(c,lv+1)).join('')}</details>`;}
const tree=document.getElementById('tree');
{let d='<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.4" flood-color="#1b2a44" flood-opacity=".22"/></filter>';
 for(const id in GR)d+=mkG(id);
 document.body.insertAdjacentHTML('afterbegin',d+'</defs></svg>');DEFS=document.querySelector('svg defs');}tree.innerHTML=`<details class="lv1" open style="--c:#16181c"><summary>핵심 기작</summary>${TREE.map(n=>node(n,1)).join('')}</details>`;

/* ---------- viewer ---------- */
let active=null;
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,L=(a,b,u)=>a+(b-a)*u;
const MOVE=1.8,HOLD=1.6;
const lerpP=(a,b,u)=>{if(typeof a==='number'&&typeof b==='number')return a+(b-a)*u;if(a&&b&&typeof a==='object'&&typeof b==='object'){const r={};for(const k of new Set([...Object.keys(a),...Object.keys(b)]))r[k]=lerpP(a[k],b[k],u);return r;}return u<.5&&a!==undefined?a:b;};
function makeViewer(host,key){const mech=M[key];const steps=mech.steps;const n=steps.length;
 const last={};steps.forEach(st=>st.o.forEach(o=>{if(o.svg==null)o.svg=last[o.id];else last[o.id]=o.svg;}));
 const S=steps.map(st=>{const m={};st.o.forEach(o=>m[o.id]={x:o.x,y:o.y,s:o.s||1,o:o.o??1,svg:o.svg,from:o.from});return m;});
 host.innerHTML=`<div class="viewer"><div class="stage"><svg viewBox="0 0 820 380"></svg></div><div class="ctl"><button class="play pri">❚❚ 멈춤</button><button class="reset">↺ 처음부터</button><input class="scrub" type="range" min="0" max="1000" value="0" aria-label="진행 위치"><select class="spd" aria-label="속도"><option value=".6">0.6×</option><option value="1" selected>1×</option><option value="1.6">1.6×</option></select></div><div class="ticks">${steps.map((_,i)=>`<i data-i="${i}">${i+1}</i>`).join('')}</div><div class="cap"></div><div class="kp">${mech.kp}</div></div>`;
 const svg=host.querySelector('svg'),cap=host.querySelector('.cap'),ticks=[...host.querySelectorAll('.ticks i')],scr=host.querySelector('.scrub'),pb=host.querySelector('.play'),spd=host.querySelector('.spd');
 const order=[],seen={};steps.forEach(st=>st.o.forEach(o=>{if(!seen[o.id]){seen[o.id]=1;order.push({id:o.id,z:o.z??0,j:order.length});}}));
 order.sort((a,b)=>a.z-b.z||a.j-b.j);const G={};const NS='http://www.w3.org/2000/svg';
 const FL=/^(sig|srp|s\d|nt|n\d|ce|pA|pB|np|g|w|atp|ef|efg|if\d?|c\d|u\d|cut)$/;
 order.forEach(({id},ix)=>{const g=document.createElementNS(NS,'g');g._j=FL.test(id)?1:0;g._ph=ix*1.7;g.setAttribute('filter','url(#sh)');const a=document.createElementNS(NS,'g'),b=document.createElementNS(NS,'g');g.append(a,b);svg.appendChild(g);G[id]={g,l:[a,b],c:['','']};});
 const str=(v,p)=>typeof v==='object'?v.f(p??v.p):v;
 function lay(id,k,html,al){const R=G[id];if(R.c[k]!==html){R.l[k].innerHTML=html;R.c[k]=html;}R.l[k].setAttribute('opacity',al);}
 let NOW=0;function put(id,x,y,s,o,A,B,u){const R=G[id];const j=R.g._j,ph=R.g._ph;const jx=j?1.6*Math.sin(NOW*1.9+ph)+0.8*Math.sin(NOW*3.7+ph*2):0,jy=j?1.4*Math.cos(NOW*2.3+ph)+0.6*Math.sin(NOW*4.1+ph):0,jr=j?2.2*Math.sin(NOW*1.3+ph):0;R.g.setAttribute('transform',`translate(${(x+jx).toFixed(2)} ${(y+jy).toFixed(2)}) rotate(${jr.toFixed(2)}) scale(${s})`);R.g.setAttribute('opacity',Math.max(0,o));
  if(o<=0.001){return;}
  if(B==null||A===B){lay(id,0,str(A),1);lay(id,1,'',0);return;}
  if(typeof A==='object'&&typeof B==='object'&&A.k===B.k){lay(id,0,A.f(lerpP(A.p,B.p,u)),1);lay(id,1,'',0);return;}
  lay(id,0,str(A),1-u);lay(id,1,str(B),u);}
 /* timeline: hold0, (move,hold)*(n-1) */
 const total=n*HOLD+(n-1)*MOVE;const startOf=k=>k===0?0:HOLD+(k-1)*(MOVE+HOLD)+MOVE;
 let t=0,playing=true,lastTs=null,shown=-1,raf=null;
 function frame(tt){let k,u;
  if(tt<HOLD){k=0;u=1;}else{const r=tt-HOLD,seg=Math.floor(r/(MOVE+HOLD)),w=r-seg*(MOVE+HOLD);k=Math.min(n-1,seg+1);u=w>=MOVE||seg+1>n-1?1:ease(w/MOVE);}
  const a=k>0?S[k-1]:{},b=S[k];
  order.forEach(({id})=>{const p=a[id],q=b[id];
   if(k===0||u===1){if(q)put(id,q.x,q.y,q.s,q.o,q.svg);else G[id].g.setAttribute('opacity',0);return;}
   if(p&&q)put(id,L(p.x,q.x,u),L(p.y,q.y,u),L(p.s,q.s,u),L(p.o,q.o,u),p.svg,q.svg,u);
   else if(q){const f=q.from||[q.x,q.y];put(id,L(f[0],q.x,u),L(f[1],q.y,u),q.s,q.o*u,q.svg);}
   else if(p)put(id,p.x,p.y,p.s,p.o*(1-u),p.svg);
   else G[id].g.setAttribute('opacity',0);});
  if(k!==shown){shown=k;cap.innerHTML=`<span class="no">${k+1} / ${n}</span>${steps[k].c}`;ticks.forEach((d,j)=>d.classList.toggle('on',j<=k));}
  scr.value=Math.round(tt/total*1000);}
 let vis=true,open=true;function loop(ts){NOW=ts/1000;if(!vis||!open){raf=null;lastTs=null;return;}if(playing&&lastTs!=null)t+=(ts-lastTs)/1000*(+spd.value);lastTs=ts;
  if(playing&&t>=total){t=total;setPlay(false);}frame(t);raf=requestAnimationFrame(loop);}
 const kick=()=>{if(!raf&&vis&&open)raf=requestAnimationFrame(loop);};
 function setPlay(v){playing=v;pb.textContent=v?'❚❚ 멈춤':'▶ 재생';lastTs=null;if(v&&t>=total)t=0;kick();}
 new IntersectionObserver(es=>{vis=es[0].isIntersecting;kick();}).observe(svg);
 pb.onclick=()=>setPlay(!playing);
 host.querySelector('.reset').onclick=()=>{t=0;frame(0);setPlay(true);};
 scr.oninput=()=>{setPlay(false);t=scr.value/1000*total;frame(t);};
 ticks.forEach(d=>d.onclick=()=>{t=startOf(+d.dataset.i);frame(t);});
 const jump=dk=>{const cur=shown;const k=Math.max(0,Math.min(n-1,cur+dk));t=startOf(k);frame(t);};
 host._v={next:()=>jump(1),prev:()=>jump(-1),pause:()=>{open=false;},play:()=>{open=true;kick();}};
 frame(0);setPlay(!matchMedia('(prefers-reduced-motion: reduce)').matches);}
tree.querySelectorAll('details.leaf').forEach(d=>d.addEventListener('toggle',()=>{const h=d.querySelector('.vh');if(d.open){if(!h._v)makeViewer(h,d.dataset.m);else{h._v.play();}active=h;}else if(h._v)h._v.pause();}));
document.addEventListener('keydown',e=>{if(!active||!active._v||!active.closest('details').open)return;if(e.key==='ArrowRight')active._v.next();if(e.key==='ArrowLeft')active._v.prev();});
document.getElementById('openAll').onclick=()=>tree.querySelectorAll('details').forEach(d=>d.open=true);
document.getElementById('closeAll').onclick=()=>tree.querySelectorAll('details.leaf').forEach(d=>d.open=false);
}
</script>
<script>
// ===== dshs42.app 공부 탭 안에서: 높이를 내용에 맞춰 부모의 iframe 을 늘립니다 (스크롤은 사이트 하나로) =====
// 애니메이션이 매 프레임 SVG 를 바꾸므로 MutationObserver 는 쓰지 않고, 크기가 바뀔 때 · 펼치고 접을 때 · 1초마다 잽니다
if (window.BIO_EMBED) {
  const frame = window.frameElement;
  const root = document.scrollingElement || document.documentElement;
  const fit = () => {
    if (!frame) return;
    const b = document.body, r = b.getBoundingClientRect();
    const h = Math.ceil(r.bottom + root.scrollTop + (parseFloat(getComputedStyle(b).marginBottom) || 0)) + 'px';
    if (frame.style.height !== h) frame.style.height = h;
    if (root.scrollTop) root.scrollTop = 0;
  };
  new ResizeObserver(fit).observe(document.body);
  document.addEventListener('toggle', () => setTimeout(fit), true);
  window.addEventListener('load', fit);
  document.fonts?.ready.then(fit);
  setInterval(fit, 1000);
  fit();
}
</script>
